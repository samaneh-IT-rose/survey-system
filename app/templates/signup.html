<!DOCTYPE html>
<html lang="fa" dir="rtl" data-mode="light" data-palette="pink">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ثبت‌نام — {{ app_title }}</title>
  <link rel="icon" href="{{ logo_url }}" type="image/png">
  <link rel="stylesheet" href="{{ asset('static/css/styles.css') }}">
</head>
<body class="loginbody">
  <div class="loginwrap">
    <!-- همان قاب تصویری صفحهٔ ورود — فیلدهای ثبت‌نام داخل کادر تصویر -->
    <div class="loginframe">
      <div class="lf-inner signup">
        <div class="lf-brand">
          <img src="{{ logo_url }}" alt="لوگو">
          <div class="lf-brandname">
            <div class="lf-org">{{ org_name }}</div>
            <div class="lf-app">ثبت‌نام کاربر جدید</div>
          </div>
        </div>

        {% if error %}
        <div class="lf-msg err" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ prefix }}/signup" class="lf-fields">
          <label>
            <span class="flabel">نام و نام خانوادگی</span>
            <input type="text" name="full_name" value="{{ form.full_name or '' }}" required
                   autocomplete="name" placeholder="مثلاً زهرا محمدی">
          </label>
          <label>
            <span class="flabel">نام کاربری</span>
            <input type="text" name="username" value="{{ form.username or '' }}" required autofocus
                   autocomplete="username" dir="ltr" placeholder="karbar1">
          </label>
          <label>
            <span class="flabel">رمز عبور</span>
            <span class="passwrap">
              <input type="password" name="password" required
                     autocomplete="new-password" dir="ltr" placeholder="••••••••">
              <button type="button" class="eyebtn" aria-label="نمایش رمز" aria-pressed="false" title="نمایش رمز">
                <svg class="ic-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="ic-eyeoff" hidden viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </span>
          </label>
          <label>
            <span class="flabel">تکرار رمز عبور</span>
            <span class="passwrap">
              <input type="password" name="password2" required
                     autocomplete="new-password" dir="ltr" placeholder="••••••••">
              <button type="button" class="eyebtn" aria-label="نمایش رمز" aria-pressed="false" title="نمایش رمز">
                <svg class="ic-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="ic-eyeoff" hidden viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </span>
          </label>
          <button type="submit" class="btn primary lf-submit">ثبت‌نام</button>
        </form>

        <a class="lf-link" href="{{ prefix }}/login">حساب کاربری دارید؟ ورود به سامانه</a>
        <p class="lf-note">حساب جدید با دسترسی «مشاهده‌گر» ساخته می‌شود؛ مدیر سامانه می‌تواند دسترسی را افزایش دهد.</p>
      </div>
    </div>
  </div>
<script src="{{ asset('static/js/password-toggle.js') }}"></script>
</body>
</html>
