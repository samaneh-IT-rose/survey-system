<!DOCTYPE html>
<html lang="fa" dir="rtl" data-mode="light" data-palette="pink">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغییر رمز عبور — {{ app_title }}</title>
  <link rel="icon" href="{{ logo_url }}" type="image/png">
  <link rel="stylesheet" href="{{ asset('static/css/styles.css') }}">
</head>
<body class="loginbody">
  <div class="loginwrap">
    <div class="logincard">
      <img class="loginlogo" src="{{ logo_url }}" alt="لوگو"
           style="width:72px;height:96px;object-fit:contain;border-radius:12px">
      <h1 class="logintitle">تغییر رمز عبور</h1>

      {% if forced %}
      <div class="loginnotice">
        برای امنیت بیشتر، در اولین ورود باید رمز عبور خود را عوض کنید. پس از تغییر، به سامانه وارد می‌شوید.
      </div>
      {% endif %}

      {% if error %}
      <div class="loginerror" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ prefix }}/change-password" class="loginform">
        <label class="field">
          <span>رمز عبور فعلی</span>
          <span class="passwrap">
            <input type="password" name="current_password" required autofocus autocomplete="current-password" dir="ltr">
            <button type="button" class="eyebtn" aria-label="نمایش رمز" aria-pressed="false" title="نمایش رمز">
              <svg class="ic-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="ic-eyeoff" hidden viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </span>
        </label>
        <label class="field">
          <span>رمز جدید (حداقل ۶ نویسه)</span>
          <span class="passwrap">
            <input type="password" name="new_password" required minlength="6" autocomplete="new-password" dir="ltr">
            <button type="button" class="eyebtn" aria-label="نمایش رمز" aria-pressed="false" title="نمایش رمز">
              <svg class="ic-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="ic-eyeoff" hidden viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </span>
        </label>
        <label class="field">
          <span>تکرار رمز جدید</span>
          <span class="passwrap">
            <input type="password" name="new_password2" required minlength="6" autocomplete="new-password" dir="ltr">
            <button type="button" class="eyebtn" aria-label="نمایش رمز" aria-pressed="false" title="نمایش رمز">
              <svg class="ic-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="ic-eyeoff" hidden viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </span>
        </label>
        <button type="submit" class="btn primary loginbtn">ذخیرهٔ رمز جدید</button>
      </form>

      <p class="loginfoot"><a href="{{ prefix }}/logout" class="mutedlink">خروج از حساب</a></p>
    </div>
  </div>
<script src="{{ asset('static/js/password-toggle.js') }}"></script>
</body>
</html>
